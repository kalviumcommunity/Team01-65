services:

  app:
    build: .
    container_name: hr_analytics

    ports:
      - "8501:8501"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./data:/app/data

  db:
    image: postgres:16

    container_name: hr_analytics_db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
